services:
  php:
    build:
      context: ./docker/php
    container_name: ebni-php
    # Runs as you, like `docker compose exec`: php-fpm can write the logs,
    # sessions and compiled views of a checkout your user owns, and what the
    # app or composer writes stays yours. On Linux, if `id -u` is not 1000,
    # put UID=... and GID=... (from `id -u` and `id -g`) in a .env file next
    # to this one.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
      # The public pages are rendered from the app's shell and translations
      # (api/config/seo.php reads ../web).
      - ./web:/var/www/web:ro
    environment:
      PHP_IDE_CONFIG: serverName=ebni
      # That user has no home in the image.
      COMPOSER_HOME: /tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ebni

  nginx:
    image: nginx:1.27-alpine
    container_name: ebni-nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - ebni

  # The site as visitors get it, on one address: the built app (web/dist)
  # and Laravel behind the production routing. `make preview` builds the app
  # and starts this; GitHub Codespaces opens it.
  preview:
    image: nginx:1.27-alpine
    container_name: ebni-preview
    profiles: ["preview"]
    ports:
      - "8080:8080"
    volumes:
      - ./web/dist:/var/www/web/dist:ro
      - ./docker/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - ebni

  mysql:
    image: mysql:8.0
    container_name: ebni-mysql
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: ebni
      MYSQL_USER: ebni
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ebni

  mysql-test:
    image: mysql:8.0
    container_name: ebni-mysql-test
    environment:
      MYSQL_DATABASE: ebni_test
      MYSQL_USER: ebni
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      # Grants the per-worker databases that `artisan test --parallel` creates.
      - ./docker/mysql-test:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ebni

  redis:
    image: redis:7-alpine
    container_name: ebni-redis
    networks:
      - ebni

  queue:
    build:
      context: ./docker/php
    container_name: ebni-queue
    # The same user as php: the worker writes the same logs.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/api
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./api:/var/www/api
      - ./web:/var/www/web:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ebni

volumes:
  mysql-data:

networks:
  ebni:
    driver: bridge
