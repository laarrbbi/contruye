; The queue worker: payment webhooks and every e-mail (confirmation, invoice,
; receipt rejection, welcome, password reset) go through it. If it stops,
; payments still arrive but nobody is told, and invoices are never sent.
;
;   sudo cp deploy/supervisor/ebni-queue.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; deploy/deploy.sh runs `artisan queue:restart` on every release: the worker
; finishes its current job, exits, and supervisor starts it on the new code.

[program:ebni-queue]
command=php /var/www/ebni/api/artisan queue:work --tries=3 --sleep=3 --max-time=3600
directory=/var/www/ebni/api
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=90
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/ebni/api/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
