; The financial template service (financials/): the professional's
; PLANTILLA_LIBRE, calculated with its original formulas for the Financials
; module. Only the API calls it, on 127.0.0.1:3100 (PLANTILLA_URL in api/.env).
; If it stops, the course plays as usual and the calculator says it is
; unavailable.
;
;   sudo cp deploy/supervisor/construye-financials.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; deploy/deploy.sh installs its dependency and, with
; FINANCIALS_PROGRAM=construye-financials, restarts it on every release.

[program:construye-financials]
command=node /var/www/construye/financials/server.js
directory=/var/www/construye/financials
user=www-data
environment=PLANTILLA_HOST="127.0.0.1",PLANTILLA_PORT="3100"
numprocs=1
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/construye/api/storage/logs/financials.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
