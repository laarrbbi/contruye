; The scheduler: runs the jobs of api/routes/console.php on time. Today, one:
; `offers:send` every ten minutes (the three offers of the course: it records
; the new moments and e-mails each offer when a student's window opens). If it
; stops, offers still show in the app, but no offer e-mail goes out.
;
;   sudo cp deploy/supervisor/construye-scheduler.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; `schedule:work` stays in the foreground and starts each due job on the code
; of the current release.

[program:construye-scheduler]
command=php /var/www/construye/api/artisan schedule:work
directory=/var/www/construye/api
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/construye/api/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
