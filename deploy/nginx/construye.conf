# Production vhost: the SPA and the API on one origin, TLS by certbot.
#
#   sudo certbot certonly --nginx -d example.es -d www.example.es   # first: this file names the certs
#   sudo cp deploy/nginx/construye.conf /etc/nginx/sites-available/construye
#   sudo ln -s /etc/nginx/sites-available/construye /etc/nginx/sites-enabled/
#
# Replace example.es, and /var/www/construye if the checkout lives elsewhere.
# One origin means no CORS and first-party Sanctum cookies: APP_URL,
# FRONTEND_URL, SESSION_DOMAIN and SANCTUM_STATEFUL_DOMAINS all name it.

# Content-Security-Policy, on documents only: the SPA's index.html and
# Laravel's own HTML pages. A PDF invoice or a receipt image gets none, where
# a policy could only get in the way of the browser's viewer. An empty value
# means nginx sends no header.
#
#   script-src 'self'       the Vite build has no inline script, no eval
#   style-src 'unsafe-inline'  Radix dialogs inject the scroll-lock <style>
#   img-src https:          course covers and partner logos are URLs the admin types
#   frame-src               the Bunny Stream player, nothing else
#
# Rehearsed behind this vhost with the production build: 25 pages as guest,
# student and admin, with menus, dialogs, the checkout, choosing a receipt
# file and a Bunny player frame. Nothing was reported except a frame from a
# host not listed here, added on purpose to prove the reporting worked.
map $sent_http_content_type $construye_csp {
    ~*^text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src https://iframe.mediadelivery.net; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.es www.example.es;
    return 301 https://example.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.es;

    ssl_certificate     /etc/letsencrypt/live/example.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.es/privkey.pem;

    return 301 https://example.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.es;

    ssl_certificate     /etc/letsencrypt/live/example.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.es/privkey.pem;

    root /var/www/construye/web/dist;
    index index.html;

    # Payment receipts are capped at 5 MB by validation; leave headroom.
    client_max_body_size 12M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy $construye_csp always;

    # Laravel: the API, Sanctum's CSRF cookie, the payment webhooks (under
    # /api) and the /up health check.
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /nonexistent @laravel;
    }

    # The public pages, also through Laravel (api/routes/seo.php): each leaves
    # the server with its own title, description, canonical URL, links to its
    # other languages, structured data and content, so search engines and link
    # previews read it without running JavaScript. Spanish at the root, /en for
    # English; plus robots.txt and the sitemap.
    location = / {
        try_files /nonexistent @laravel;
    }
    location ~ ^/(?:en/?|(?:en/)?cursos(?:/[^/]+)?/?|robots\.txt|sitemap\.xml)$ {
        try_files /nonexistent @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/construye/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    # No add_header inside the locations below: nginx drops every
    # server-level add_header (the security headers above) in a location
    # that declares its own. `expires` sets Cache-Control without that trap.

    # Vite fingerprints everything under /assets: cache it for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app's own screens: the shell, which tells search engines not to
    # index them. Keep in step with the routes in web/src/App.tsx.
    location ~ ^/(?:login|register|forgot-password|reset-password|dashboard|orders|checkout|learn|admin)(?:/|$) {
        try_files $uri /index.html;
    }

    # Files from the build. Anything else is a real 404: the visitor gets the
    # app's own "page not found", search engines the status (no soft 404s).
    # index.html itself is never cached, so a deploy is visible on the next
    # page load.
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
