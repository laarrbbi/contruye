; PHP settings Construye Academy needs on the server. Ubuntu's PHP refuses any
; upload over 2 MB by default, before Laravel sees it; buyers send bank-transfer and
; Bizum receipts of up to 5 MB, often phone photos of 3-4 MB.
;
; Install for PHP-FPM (the web) and the CLI (queue worker, artisan):
;   sudo cp deploy/php/99-construye.ini /etc/php/8.3/fpm/conf.d/
;   sudo cp deploy/php/99-construye.ini /etc/php/8.3/cli/conf.d/
;   sudo systemctl reload php8.3-fpm
;
; Keep these in line with client_max_body_size in deploy/nginx/construye.conf
; (12M) and the 'max:5120' rule in UploadReceiptRequest.

upload_max_filesize = 10M
post_max_size = 12M

; Never tell visitors which PHP version runs the site.
expose_php = Off
